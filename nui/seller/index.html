<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendeur de Poissons</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container" id="app" style="display: none;">
        <div class="tablet">
            <div class="tablet-header">
                <div class="header-left">
                    <i class="fas fa-store"></i>
                    <span class="header-title">VENDEUR DE POISSONS</span>
                </div>
                <div class="header-right">
                    <button class="close-btn" id="closeBtn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <div class="tablet-body">
                <div class="seller-info">
                    <h2>Vendre vos Poissons</h2>
                    <p class="seller-subtitle">Sélectionnez les poissons que vous souhaitez vendre</p>
                </div>

                <div class="fish-list" id="fishList">
                    <!-- Liste générée dynamiquement -->
                </div>

                <div class="summary-section">
                    <div class="summary-card">
                        <div class="summary-label">Total estimé:</div>
                        <div class="summary-value" id="totalValue">$0</div>
                    </div>
                    <button class="sell-all-btn" id="sellAllBtn" disabled>
                        <i class="fas fa-hand-holding-usd"></i>
                        <span>Vendre tout</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
